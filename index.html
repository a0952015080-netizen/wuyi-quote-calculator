<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>訂單報價小幫手</title>
  <style>
    :root {
      --primary: #06c755;
      --primary-dark: #05a847;
      --primary-light: #e8f9ee;
      --bg: #f6f7fb;
      --card-bg: #ffffff;
      --text: #22252a;
      --text-sub: #6c757d;
      --border: #e2e5eb;
      --border-focus: #06c755;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 14px 40px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin: 8px 0 16px;
      color: #1f2329;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .segment-group {
      display: flex;
      background: #ededf2;
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      margin-bottom: 10px;
    }

    .segment-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 9px 8px;
      font-size: 14px;
      font-weight: 600;
      color: #555c68;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .segment-btn.active {
      background: #ffffff;
      color: #111;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .sub-panel {
      background: #fbfbfd;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-box {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: var(--border-focus);
    }

    .input-box::placeholder {
      color: #a0aec0;
      font-size: 14px;
    }

    .chips-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .chip-btn {
      flex: 1;
      border: 1.5px solid var(--border);
      background: #fff;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .chip-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.15s;
    }

    .toggle-row.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .toggle-title {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-badge {
      font-size: 13px;
      font-weight: 700;
      color: #2b7440;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .addon-btn {
      background: #ffffff;
      border: 1.5px solid var(--border);
      padding: 11px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      transition: all 0.15s ease;
    }

    .addon-btn span {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
    }

    .addon-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: #0d6832;
    }

    .addon-btn.active span {
      color: var(--primary-dark);
      font-weight: 600;
    }

    .stepper-card {
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .stepper-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .stepper-info .name {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .stepper-info .sub {
      font-size: 12px;
      color: #6b7280;
    }

    .stepper-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #374151;
      cursor: pointer;
    }

    .step-btn:active {
      background: #e5e7eb;
    }

    .step-val {
      font-size: 15px;
      font-weight: 700;
      min-width: 22px;
      text-align: center;
    }

    .custom-item-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .custom-item-row:last-child {
      margin-bottom: 0;
    }

    .total-panel {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1.5px solid #d1fae5;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .total-panel .label {
      font-size: 14px;
      font-weight: 600;
      color: #065f46;
    }

    .total-panel .amount {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary-dark);
      font-variant-numeric: tabular-nums;
    }

    .preview-box {
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #4b5563;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .preview-title {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .btn-action {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action:active {
      transform: scale(0.985);
      background: var(--primary-dark);
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #9ca3af;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="header-title">📋 訂單報價小幫手</h1>

    <!-- 1. 主品項：花束 / 提袋 -->
    <div class="card">
      <div class="card-title">💐 花束品項</div>
      <div class="segment-group">
        <button type="button" class="segment-btn active" id="btnFlowerNone" onclick="setFlowerMode('none')">無</button>
        <button type="button" class="segment-btn" id="btnFlowerActive" onclick="setFlowerMode('flower')">花束</button>
      </div>

      <div id="flowerDetail" class="sub-panel" style="display: none;">
        <div class="chips-row">
          <button type="button" class="chip-btn active" id="btnFlower390" onclick="setFlowerPriceType('390')">$390</button>
          <button type="button" class="chip-btn" id="btnFlowerCustom" onclick="setFlowerPriceType('custom')">選填價格</button>
        </div>
        <div id="flowerCustomInputWrap" style="display: none; margin-bottom: 8px;">
          <input type="number" id="flowerCustomPrice" class="input-box" placeholder="請輸入花束金額" inputmode="numeric" oninput="calc()">
        </div>

        <div class="toggle-row" id="bagToggle" onclick="toggleBag()">
          <span class="toggle-title">🛍️ 提袋</span>
          <span class="toggle-badge">+$40</span>
        </div>
      </div>
    </div>

    <!-- 2. 主品項：蛋糕 -->
    <div class="card">
      <div class="card-title">🎂 蛋糕品項</div>
      <div class="segment-group">
        <button type="button" class="segment-btn active" id="btnCakeNone" onclick="setCakeMode('none')">無</button>
        <button type="button" class="segment-btn" id="btnCakeActive" onclick="setCakeMode('cake')">蛋糕</button>
      </div>

      <div id="cakeDetail" class="sub-panel" style="display: none;">
        <input type="number" id="cakePrice" class="input-box" placeholder="請輸入蛋糕金額" inputmode="numeric" oninput="calc()">
      </div>
    </div>

    <!-- 3. 常見加購 -->
    <div class="card">
      <div class="card-title">🍴 餐具加購</div>
      <div class="grid-3">
        <button type="button" class="addon-btn" id="addon-utensil2" onclick="toggleAddon('utensil2', '2人餐具', 15)">
          2人餐具
          <span>+$15</span>
        </button>
        <button type="button" class="addon-btn" id="addon-utensil5" onclick="toggleAddon('utensil5', '5人餐具', 30)">
          5人餐具
          <span>+$30</span>
        </button>
        <button type="button" class="addon-btn" id="addon-utensil10" onclick="toggleAddon('utensil10', '10人餐具', 50)">
          10人餐具
          <span>+$50</span>
        </button>
      </div>

      <div class="card-title" style="margin-top: 14px;">🕯️ 蠟燭 / 配件</div>
      
      <!-- 蠟燭 $45 / $55 -->
      <div class="grid-2">
        <button type="button" class="addon-btn" id="addon-candle45" onclick="selectCandle(45)">
          蠟燭
          <span>+$45</span>
        </button>
        <button type="button" class="addon-btn" id="addon-candle55" onclick="selectCandle(55)">
          蠟燭
          <span>+$55</span>
        </button>
      </div>

      <!-- 數字蠟燭 -->
      <div class="stepper-card" id="numCandleCard">
        <div class="stepper-info">
          <div class="name">數字蠟燭</div>
          <div class="sub">$30 / 支</div>
        </div>
        <div class="stepper-ctrl">
          <button type="button" class="step-btn" onclick="changeNumCandle(-1)">−</button>
          <span class="step-val" id="numCandleQty">0</span>
          <button type="button" class="step-btn" onclick="changeNumCandle(1)">+</button>
        </div>
      </div>

      <!-- 保冰袋 -->
      <div class="toggle-row" id="iceBagToggle" onclick="toggleIceBag()" style="margin-top: 0; margin-bottom: 12px;">
        <span class="toggle-title">🧊 保冰袋</span>
        <span class="toggle-badge">+$100</span>
      </div>

      <!-- 其他與備註 -->
      <div class="card-title" style="margin-top: 12px;">✏️ 其他與備註</div>
      
      <div class="custom-item-row">
        <input type="text" id="otherName" class="input-box" style="flex: 2;" placeholder="其他項目（預設：其他）" oninput="calc()">
        <input type="number" id="otherPrice" class="input-box" style="flex: 1.2;" placeholder="金額" inputmode="numeric" oninput="calc()">
      </div>

      <div class="custom-item-row">
        <input type="text" id="noteName" class="input-box" style="flex: 2;" placeholder="備註說明（預設：備註）" oninput="calc()">
        <input type="number" id="notePrice" class="input-box" style="flex: 1.2;" placeholder="金額" inputmode="numeric" oninput="calc()">
      </div>
    </div>

    <!-- 總計欄位 -->
    <div class="total-panel">
      <span class="label">預估總金額</span>
      <span class="amount" id="displayTotal">$0</span>
    </div>

    <!-- 報價預覽區塊 -->
    <div class="preview-title">訊息預覽</div>
    <div class="preview-box" id="previewText">您好呀～
幫您加總一下
總共$0
您看對不對喔～</div>

    <!-- 操作按鈕 -->
    <button type="button" class="btn-action" onclick="copyAndReturn()">
      <span>📋 複製報價並跳回 LINE</span>
    </button>
    <button type="button" class="btn-secondary" onclick="resetForm()">全部清除重填</button>
  </div>

  <div id="toast" class="toast">已複製報價內容！</div>

  <script>
    const state = {
      flowerMode: 'none',
      flowerPriceType: '390',
      hasBag: false,
      cakeMode: 'none',
      addons: new Map(),
      candlePrice: 0,
      numCandleQty: 0,
      hasIceBag: false
    };

    function setFlowerMode(mode) {
      state.flowerMode = mode;
      document.getElementById('btnFlowerNone').classList.toggle('active', mode === 'none');
      document.getElementById('btnFlowerActive').classList.toggle('active', mode === 'flower');
      document.getElementById('flowerDetail').style.display = (mode === 'flower') ? 'block' : 'none';
      calc();
    }

    function setFlowerPriceType(type) {
      state.flowerPriceType = type;
      document.getElementById('btnFlower390').classList.toggle('active', type === '390');
      document.getElementById('btnFlowerCustom').classList.toggle('active', type === 'custom');
      document.getElementById('flowerCustomInputWrap').style.display = (type === 'custom') ? 'block' : 'none';
      if (type === 'custom') {
        document.getElementById('flowerCustomPrice').focus();
      }
      calc();
    }

    function toggleBag() {
      state.hasBag = !state.hasBag;
      document.getElementById('bagToggle').classList.toggle('active', state.hasBag);
      calc();
    }

    function setCakeMode(mode) {
      state.cakeMode = mode;
      document.getElementById('btnCakeNone').classList.toggle('active', mode === 'none');
      document.getElementById('btnCakeActive').classList.toggle('active', mode === 'cake');
      document.getElementById('cakeDetail').style.display = (mode === 'cake') ? 'block' : 'none';
      if (mode === 'cake') {
        document.getElementById('cakePrice').focus();
      }
      calc();
    }

    function toggleAddon(key, name, price) {
      const btn = document.getElementById(`addon-${key}`);
      if (state.addons.has(key)) {
        state.addons.delete(key);
        btn.classList.remove('active');
      } else {
        state.addons.set(key, { name, price });
        btn.classList.add('active');
      }
      calc();
    }

    function selectCandle(price) {
      const btn45 = document.getElementById('addon-candle45');
      const btn55 = document.getElementById('addon-candle55');
      if (state.candlePrice === price) {
        state.candlePrice = 0;
        btn45.classList.remove('active');
        btn55.classList.remove('active');
      } else {
        state.candlePrice = price;
        btn45.classList.toggle('active', price === 45);
        btn55.classList.toggle('active', price === 55);
      }
      calc();
    }

    function changeNumCandle(delta) {
      state.numCandleQty = Math.max(0, state.numCandleQty + delta);
      document.getElementById('numCandleQty').textContent = state.numCandleQty;
      document.getElementById('numCandleCard').classList.toggle('active', state.numCandleQty > 0);
      calc();
    }

    function toggleIceBag() {
      state.hasIceBag = !state.hasIceBag;
      document.getElementById('iceBagToggle').classList.toggle('active', state.hasIceBag);
      calc();
    }

    function getSummaryData() {
      const items = [];
      let total = 0;

      // 花束
      if (state.flowerMode === 'flower') {
        let fPrice = 0;
        if (state.flowerPriceType === '390') {
          fPrice = 390;
        } else {
          const val = parseInt(document.getElementById('flowerCustomPrice').value, 10);
          if (!isNaN(val) && val > 0) fPrice = val;
        }

        if (fPrice > 0) {
          items.push(`花束$${fPrice}`);
          total += fPrice;
        }

        if (state.hasBag) {
          items.push('提袋$40');
          total += 40;
        }
      }

      // 蛋糕
      if (state.cakeMode === 'cake') {
        const cPrice = parseInt(document.getElementById('cakePrice').value, 10);
        if (!isNaN(cPrice) && cPrice > 0) {
          items.push(`蛋糕$${cPrice}`);
          total += cPrice;
        }
      }

      // 餐具
      state.addons.forEach(item => {
        items.push(`${item.name}$${item.price}`);
        total += item.price;
      });

      // 蠟燭
      if (state.candlePrice > 0) {
        items.push(`蠟燭$${state.candlePrice}`);
        total += state.candlePrice;
      }

      // 數字蠟燭
      if (state.numCandleQty > 0) {
        const ncPrice = state.numCandleQty * 30;
        items.push(`數字蠟燭(${state.numCandleQty}支)$${ncPrice}`);
        total += ncPrice;
      }

      // 保冰袋
      if (state.hasIceBag) {
        items.push('保冰袋$100');
        total += 100;
      }

      // 其他
      const otherPrice = parseInt(document.getElementById('otherPrice').value, 10);
      if (!isNaN(otherPrice) && otherPrice > 0) {
        const otherName = document.getElementById('otherName').value.trim() || '其他';
        items.push(`${otherName}$${otherPrice}`);
        total += otherPrice;
      }

      // 備註
      const notePrice = parseInt(document.getElementById('notePrice').value, 10);
      if (!isNaN(notePrice) && notePrice > 0) {
        const noteName = document.getElementById('noteName').value.trim() || '備註';
        items.push(`${noteName}$${notePrice}`);
        total += notePrice;
      }

      return { items, total };
    }

    function buildOutputText(items, total) {
      const header = '您好呀～\n幫您加總一下';
      const footer = `總共$${total}\n您看對不對喔～`;
      if (items.length === 0) {
        return `${header}\n${footer}`;
      }
      return `${header}\n${items.join('\n')}\n${footer}`;
    }

    function calc() {
      const { items, total } = getSummaryData();
      document.getElementById('displayTotal').textContent = `$${total}`;
      document.getElementById('previewText').textContent = buildOutputText(items, total);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function copyAndReturn() {
      const { items, total } = getSummaryData();
      if (items.length === 0) {
        alert('請先選擇或輸入至少一項品項金額！');
        return;
      }

      const text = buildOutputText(items, total);

      const handleSuccess = () => {
        showToast('已複製！即將跳回 LINE');
        setTimeout(() => {
          window.location.href = "line://";
        }, 300);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(handleSuccess).catch(() => {
          fallbackCopy(text);
          handleSuccess();
        });
      } else {
        fallbackCopy(text);
        handleSuccess();
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
      } catch (e) {
        console.error('複製失敗', e);
      }
      document.body.removeChild(ta);
    }

    function resetForm() {
      setFlowerMode('none');
      setFlowerPriceType('390');
      state.hasBag = false;
      document.getElementById('bagToggle').classList.remove('active');
      document.getElementById('flowerCustomPrice').value = '';

      setCakeMode('none');
      document.getElementById('cakePrice').value = '';

      state.addons.clear();
      document.querySelectorAll('.addon-btn').forEach(btn => btn.classList.remove('active'));

      state.candlePrice = 0;
      state.numCandleQty = 0;
      document.getElementById('numCandleQty').textContent = '0';
      document.getElementById('numCandleCard').classList.remove('active');

      state.hasIceBag = false;
      document.getElementById('iceBagToggle').classList.remove('active');

      document.getElementById('otherName').value = '';
      document.getElementById('otherPrice').value = '';
      document.getElementById('noteName').value = '';
      document.getElementById('notePrice').value = '';

      calc();
      showToast('已重設所有選項');
    }

    calc();
  </script>
